[package]
name = "bork"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An escalating visual break reminder for Hyprland"
license = "MIT"
repository = "https://github.com/hschne/bork"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "fontconfig"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "1", features = ["event", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.18"
tempfile = "3"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
lto = "fat"
strip = true
