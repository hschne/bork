name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test installer
        run: bash tests/install.sh
      - name: Build verification environment
        run: docker build --target verify -t bork-verify:ci .
      - name: Check
        run: >-
          docker run --rm --network none bork-verify:ci bash -c
          'cargo fmt --all -- --check &&
          cargo clippy --locked --all-targets -- -D warnings &&
          cargo test --locked'
      - name: Test preview
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:exec --tmpfs /run
          bork-verify:ci bash /build/tests/preview-smoke.sh
          /artifact/bork /tmp/preview
      - name: Build distribution
        run: docker build --target artifact --output type=local,dest=dist .
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(./dist/bork --version | awk '{print $2}')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          binary="bork-linux-${ARCH}"
          mkdir -p "$RUNNER_TEMP/packages"
          install -m755 dist/bork "$RUNNER_TEMP/packages/$binary"
          cp dist/install.sh "$RUNNER_TEMP/packages/install.sh"
          cd "$RUNNER_TEMP/packages"
          sha256sum "$binary" > "$binary.sha256"
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bork-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bork-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/bork-linux-* dist/install.sh
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes
